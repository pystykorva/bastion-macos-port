name: Build

on:
  push:
    branches: [native-macos-port, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  package:
    name: Package (ad-hoc signed)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Pull-request builds and forks have no secrets, so they get no feedback address and cannot deliver
      # messages to the maintainer. Only tag builds in the maintainer's own repository receive these.
      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
          TESSU_FEEDBACK_EMAIL: ${{ secrets.TESSU_FEEDBACK_EMAIL }}
          TESSU_FEEDBACK_ISSUES_URL: ${{ secrets.TESSU_FEEDBACK_ISSUES_URL }}
        run: |
          VERSION="${VERSION#v}" ./scripts/package.sh

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: tessu-macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2.2.2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*.dmg
